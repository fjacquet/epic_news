services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: epic-news-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env
      - ./db:/app/db
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Add API_URL environment variable to connect to an external API
      - API_URL=${API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: epic-news-network
    driver: bridge

volumes:
  db_data:
  app_data:
  app_output:
