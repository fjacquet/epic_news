# `docker compose up -d` pulls the published images; `docker compose up -d --build` builds
# them from the Dockerfile targets; `docker compose up -d api` starts the API alone.
services:
  api:
    image: ghcr.io/fjacquet/epic-news-api:latest
    build:
      context: .
      target: api
    container_name: epic-news-api
    restart: unless-stopped
    ports:
      - "${EPIC_API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./db:/app/db
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - EPIC_API_TOKEN=${EPIC_API_TOKEN:-}
      - EPIC_API_MAX_CONCURRENT=${EPIC_API_MAX_CONCURRENT:-1}
    networks:
      - epic-news-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    image: ghcr.io/fjacquet/epic-news-streamlit:latest
    build:
      context: .
      target: streamlit
    container_name: epic-news-streamlit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./.env:/app/.env
      - ./db:/app/db
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - epic-news-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  epic-news-network:
    driver: bridge
