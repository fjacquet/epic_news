global_reporting:
  description: >
    Create a comprehensive and extensive global intelligence report on {target} by
    cross-referencing the six OSINT sub-reports below. They are JSON documents keyed by
    area (company_profile, tech_stack, web_presence, hr_intelligence, legal_analysis,
    geospatial_analysis); a report that could not be produced or read is simply absent,
    and a long report may end with a truncation marker.
    Use ONLY facts found in these sub-reports and in the intelligence products from the
    previous tasks. Never invent an entity, figure or date, and never name a company
    other than {target}. Where a sub-report is missing or thin, say so in
    information_gaps.
    The report must be extremely detailed and maintain the depth of the source reports:
    - A thorough executive summary capturing all key findings
    - Cross-domain patterns, links and contradictions between the sub-reports
    - A highly structured organization with clear sections
    - Technical details, statistics and supporting evidence from the sources
    Your output is a structured JSON object that integrates the information from the
    sub-reports; it is not a list of the sub-reports or a description of them.

    OSINT SUB-REPORTS:
    {osint_reports}
  expected_output: >
    A comprehensive global intelligence report on {target} as a JSON object with the keys
    target (the company name, {target}), executive_summary, detailed_findings,
    confidence_assessment and information_gaps.
    detailed_findings is NEVER an empty object. It has exactly these six keys
    (company_profile, tech_stack, web_presence, hr_intelligence, legal_analysis,
    geospatial_analysis), each a string of a few sentences with the concrete facts of that
    area taken from the matching sub-report (for an area with no data, the string says
    that no data was available).
    executive_summary stays a short synthesis; the per-area facts belong in
    detailed_findings.
  agent: osint_reporter
  output_file: '{output_file}'
